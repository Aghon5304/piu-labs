<style>
  :host {
    display: block;
    padding: 20px;
    background-color: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  .checkout-container {
    max-width: 600px;
    margin: 0 auto;
  }

  h2 {
    color: #333;
    margin-bottom: 20px;
  }

  .cart-items {
    list-style: none;
    padding: 0;
    margin: 0 0 20px 0;
  }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background-color: white;
    border: 1px solid #eee;
    border-radius: 4px;
    margin-bottom: 10px;
  }

  .item-info {
    flex: 1;
  }

  .item-name {
    font-weight: bold;
    color: #333;
    margin-bottom: 4px;
  }

  .item-price {
    color: #666;
    font-size: 14px;
  }

  .remove-btn {
    background-color: #ff4444;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }

  .remove-btn:hover {
    background-color: #cc0000;
  }

  .summary {
    background-color: white;
    padding: 15px;
    border-radius: 4px;
    border: 1px solid #eee;
    margin-top: 20px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .summary-row.total {
    font-weight: bold;
    font-size: 18px;
    border-top: 2px solid #ddd;
    padding-top: 10px;
    color: #333;
  }
  .items-list {
    width: 100%;
  }
</style>

<div class="checkout-container">
  <h2>Shopping Cart</h2>
  <ul class="cart-items"></ul>
  <div class="summary">
    <div class="summary-row">
      <span>Items:</span>
      <ol class="items-list"></ol>
    </div>
    <div class="summary-row total">
      <span>Total:</span>
      <span class="total-price">0.00</span>
    </div>
  </div>
</div>
